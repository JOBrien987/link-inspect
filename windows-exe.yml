name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  release:
    types: [published]

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Build GUI executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name "Suspicious-Link-Inspector" app.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Suspicious-Link-Inspector-Windows
          path: dist/Suspicious-Link-Inspector.exe
          if-no-files-found: error
